const PK='#4b4855', PINK='#ffb7c0', LAV='#b9a3e6', LAV2='#9a82d6';
function penguin(o={}){
  const {x=540,y=1000,s=1,eyes='happy',arms='down',cls='bob',lie=false}=o;
  let E='';
  if(eyes==='happy') E=`<path d="M-80 -28 q24 -30 48 0 M32 -28 q24 -30 48 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  else if(eyes==='calm') E=`<path d="M-80 -34 q24 24 48 0 M32 -34 q24 24 48 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`;

  let flipR=`<ellipse cx="150" cy="70" rx="34" ry="80" fill="${PK}" stroke="${INK}" stroke-width="7" transform="rotate(-18 150 70)"/>`;
  let front='';
  if(arms==='think') flipR=`<ellipse cx="96" cy="70" rx="32" ry="82" fill="${PK}" stroke="${INK}" stroke-width="7" transform="rotate(-150 96 70)"/>`;
  if(arms==='phone') front=`<g transform="rotate(14 90 70)"><rect x="40" y="0" width="100" height="160" rx="22" fill="${LAV}" stroke="${INK}" stroke-width="7"/><rect x="56" y="18" width="68" height="110" rx="10" fill="#e9e1ff"/></g><ellipse cx="128" cy="110" rx="34" ry="62" fill="${PK}" stroke="${INK}" stroke-width="7" transform="rotate(-30 128 110)"/>`;
  if(arms==='heartPink'||arms==='heartYellow'){ const c=arms==='heartPink'?'#ff9fb2':'#ffe27a';
    front=`<path d="M0 230 C-150 140 -160 40 -90 30 C-50 24 -10 50 0 80 C10 50 50 24 90 30 C160 40 150 140 0 230Z" fill="${c}" stroke="${INK}" stroke-width="7"/><ellipse cx="-120" cy="120" rx="34" ry="60" fill="${PK}" stroke="${INK}" stroke-width="7" transform="rotate(40 -120 120)"/><ellipse cx="120" cy="120" rx="34" ry="60" fill="${PK}" stroke="${INK}" stroke-width="7" transform="rotate(-40 120 120)"/>`;}
  const body=`
   <ellipse cx="-62" cy="196" rx="50" ry="22" fill="#ffc23a" stroke="${INK}" stroke-width="7"/><ellipse cx="62" cy="196" rx="50" ry="22" fill="#ffc23a" stroke="${INK}" stroke-width="7"/>
   ${arms==='heartPink'||arms==='heartYellow'?'':flipL}
   <path d="M-160 60 C-170 -130 -95 -205 0 -205 C95 -205 170 -130 160 60 C155 165 95 200 0 200 C-95 200 -155 165 -160 60Z" fill="${PK}" stroke="${INK}" stroke-width="8"/>
   <path d="M0 -84 C22 -136 122 -136 126 -16 C130 104 76 186 0 186 C-76 186 -130 104 -126 -16 C-122 -136 -22 -136 0 -84Z" fill="#fff" stroke="${INK}" stroke-width="5"/>
   ${arms==='heartPink'||arms==='heartYellow'?'':flipR}
   <path d="M-150 70 Q0 128 150 70 L146 116 Q0 172 -146 116Z" fill="${LAV}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
   <path d="M70 120 L110 120 L122 230 L82 236Z" fill="${LAV}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><path d="M84 214 h34" stroke="${LAV2}" stroke-width="6"/>
   <ellipse cx="-92" cy="18" rx="26" ry="16" fill="${PINK}"/><ellipse cx="92" cy="18" rx="26" ry="16" fill="${PINK}"/>
   ${E}
   <path d="M-26 -6 Q0 -22 26 -6 Q14 22 0 24 Q-14 22 -26 -6Z" fill="#ffad2e" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
   <path d="M0 -203 q6 -20 2 -34" stroke="#4f9a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
   <g transform="translate(2 -250)">${[0,120,240].map(a=>`<g transform="rotate(${a})"><path d="M0 0 C-30 -14 -34 -46 -14 -50 C-4 -52 0 -44 0 -38 C0 -44 4 -52 14 -50 C34 -46 30 -14 0 0Z" fill="#86d35f" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></g>`).join('')}</g>
   ${front}`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="214" rx="170" ry="24" fill="#000" opacity=".07"/><g class="${cls}">${body}</g></g>`;

function ffeat(face){
  const e = face==='happy'
    ? `<path d="M-46 -6 q14 -18 28 0 M18 -6 q14 -18 28 0" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>`
    : face==='cool' ? `<path d="M-46 -6 h28 M18 -6 h28" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`
    : face==='sleepy' ? `<path d="M-46 -10 q14 14 28 0 M18 -10 q14 14 28 0" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>`
    : face==='angry' ? `<ellipse cx="-32" cy="-4" rx="9" ry="11" fill="${INK}"/><ellipse cx="32" cy="-4" rx="9" ry="11" fill="${INK}"/><path d="M-52 -30 l30 12 M52 -30 l-30 12" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`

    : face==='love' ? ['-32','32'].map(cx=>`<path transform="translate(${cx} -6) scale(.55)" d="M0 22 C-34 0 -30 -26 -14 -26 C-5 -26 0 -19 0 -14 C0 -19 5 -26 14 -26 C30 -26 34 0 0 22Z" fill="#ff5d7a" stroke="${INK}" stroke-width="6"/>`).join('')

  return `${e}<ellipse cx="-52" cy="16" rx="15" ry="9" fill="${BLUSH}" opacity=".9"/><ellipse cx="52" cy="16" rx="15" ry="9" fill="${BLUSH}" opacity=".9"/><path d="M-10 18 q10 10 20 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
}
const FR={
 water:(f)=>`<path d="M0 -150 C50 -80 110 -20 110 40 C110 100 60 130 0 130 C-60 130 -110 100 -110 40 C-110 -20 -50 -80 0 -150Z" fill="#8cc6f5" stroke="${INK}" stroke-width="7"/><path d="M-60 0 q-6 -30 16 -60" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity=".8"/><g transform="translate(0 40)">${ffeat(f)}</g>`,

};

(function(){

      money:'정보·말·흐름으로 버는 타입이에요. 대신 들어온 만큼 새기 쉬워서 월급날 자동 적금 같은 "둑"이 꼭 필요해요.',

    화:{key:'fire',name:'불',friend:'불꽃이',color:'#e0553a',bar:'#ff9b6b',one:'열정적이고 표현이 확실한 사람',
      love:'좋으면 바로 티가 나는 직진형이에요. 대신 식는 것도 빨라서, 온도를 맞춰 줄 사람이 필요해요.',
      money:'나를 보여줄수록 돈이 벌리는 타입이에요. 기분 좋을 때 결제 버튼은 하루만 재워 두세요.',
      match:'차분한 물 같은 사람. 화를 내도 조용히 들어주는 사람 옆에서 오래 빛나요.'},
    목:{key:'wood',name:'나무',friend:'새싹이',color:'#2f9a5a',bar:'#8fd48e',one:'성장과 새로운 시작을 좋아하는 사람',
      love:'미래 계획에 상대를 넣는 타입이에요. 혼자 다 하려다 지치기 쉬우니 기대는 연습도 필요해요.',

    금:{key:'metal',name:'쇠',friend:'반짝이',color:'#8a7a3a',bar:'#cdbf7a',one:'정확하고 기준이 분명한 사람',
      love:'말은 없어도 행동으로 다 챙기는 타입이에요. 첫인상은 차가워 보여도 속은 여려요.',
      money:'정확함이 무기인 타입이에요. 자격증·전문 기술처럼 나를 단련할수록 평생 가는 돈이 돼요.',
      match:'따뜻한 불 같은 사람. 먼저 웃어 주는 사람 옆에서 보석처럼 빛나요.'},
    토:{key:'earth',name:'흙',friend:'흙곰이',color:'#a0632a',bar:'#d9a86c',one:'성실하고 다 받아주는 든든한 사람',
      love:'언제나 그 자리에 있어 주는 타입이에요. 속상한 것도 혼자 다 품어서 오래 아파할 때가 있어요.',
      money:'쌓을수록 돈이 되는 타입이에요. 통장에만 묵혀 두지 말고 작게라도 굴려 보세요.',
      match:'꿈 많은 나무 같은 사람. 하고 싶은 게 많은 사람이 굳은 땅을 살려 줘요.'}
  };
  const ORDER=['목','화','토','금','수'];
  const LACK={목:'새로운 시작과 배움이 운을 열어 줘요.',화:'밝은 사람, 햇빛, 표현하는 습관이 운을 열어 줘요.',토:'규칙적인 생활과 믿을 만한 사람이 운을 잡아 줘요.',금:'정리 정돈과 분명한 기준이 운을 다듬어 줘요.',수:'쉼과 깊은 대화, 혼자 생각할 시간이 운을 채워 줘요.'};
  let last=null;

  $('goBtn').addEventListener('click',()=>{
    $('msg').textContent='';
    const y=+$('y').value,m=+$('m').value,d=+$('d').value,h=$('h').value;
    if(!(y>=1900&&y<=2100)||!(m>=1&&m<=12)||!(d>=1&&d<=31)){$('msg').textContent='생년월일을 정확히 입력해 주세요. (예: 1995 / 5 / 12)';return;}
    let r;
    try{
      r=GuiinSaju.calculate({calendar:val('cSeg'),year:y,month:m,day:d,leapMonth:$('leap').checked,hourUnknown:h==='',hour:h===''?12:+h,minute:h===''?0:30,gender:val('gSeg'),dayBoundary:'23'});
    }catch(e){$('msg').textContent='날짜를 다시 확인해 주세요. '+(e&&e.message?'('+e.message+')':'');return;}
    const c=r.elCount||{};const total=ORDER.reduce((a,k)=>a+(+c[k]||0),0)||1;
    const dm=r.pillars?.day?.stemEl;
    let top=ORDER.slice().sort((a,b)=>(c[b]-c[a])||((b===dm)-(a===dm)))[0];
    let low=ORDER.slice().sort((a,b)=>c[a]-c[b])[0];
    const E=EL[top];
    last={top,E,y,m,d,h,g:val('gSeg'),cal:val('cSeg'),leap:$('leap').checked,day:r.pillars?.day?.ko};
    $('typeCard').innerHTML=`<div class="k">당신은</div><h2 style="color:${E.color}">${E.name} 많은 사람</h2><div class="one">${E.one}</div><svg viewBox="-170 -230 340 480">${FR[E.key]('happy')}<g transform="translate(0 200)"><rect x="-95" y="-34" width="190" height="68" rx="34" fill="#fff" stroke="${E.color}" stroke-width="5"/><text y="13" font-size="36" font-weight="800" fill="${E.color}" text-anchor="middle" font-family="-apple-system,Apple SD Gothic Neo,Noto Sans KR,sans-serif">${E.friend} 타입</text></g></svg>`;
    $('bars').innerHTML=ORDER.map(k=>{const p=Math.round((+c[k]||0)/total*100);return `<div class="bar"><span class="n" style="color:${EL[k].color}">${EL[k].name}</span><span class="t"><i style="width:${Math.max(p,3)}%;background:${EL[k].bar}"></i></span><span class="v">${p}%</span></div>`}).join('');
    $('lack').innerHTML=`<b>부족한 기운: ${EL[low].name}</b><br>${LACK[low]}`;
    $('traits').innerHTML=`<div class="trait" style="margin-top:0"><h3>💘 연애할 때</h3><p>${E.love}</p></div><div class="trait"><h3>💰 돈 버는 스타일</h3><p>${E.money}</p></div><div class="trait"><h3>🤝 잘 맞는 사람</h3><p>${E.match}</p></div><p style="margin-top:14px;font-size:14px;color:#8e86a8;line-height:1.5">여기까지는 맛보기예요. 내 일간(${last.day||''}일주)과 대운까지 보면 언제 돈이 들어오고, 언제 인연이 오는지까지 나와요.</p>`;
    const q=new URLSearchParams({oy:y,om:m,od:d,ocal:last.cal,og:last.g});if(h!=='')q.set('oh',h);if(last.leap)q.set('oleap','1');
    $('fullLink').href='/?'+q.toString()+'#saju';
    $('result').style.display='block';
    setTimeout(()=>$('result').scrollIntoView({behavior:'smooth',block:'start'}),50);
  });

  function cardSVG(){
    const E=last.E;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#fdf3d6"/>
    <g font-family="-apple-system,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif" text-anchor="middle">
    <text x="540" y="150" font-size="44" font-weight="700" fill="#8e86a8">나는 무슨 기운?</text>
    <text x="540" y="250" font-size="96" font-weight="900" fill="${E.color}">${E.name} 많은 사람</text>
    <text x="540" y="330" font-size="44" font-weight="700" fill="#4a4560">${E.one}</text>
    <g transform="translate(540 680) scale(1.3)">${FR[E.key]('happy')}</g>
    <rect x="300" y="900" width="480" height="96" rx="48" fill="#fff" stroke="${E.color}" stroke-width="6"/>
    <text x="540" y="964" font-size="48" font-weight="800" fill="${E.color}">${E.friend} 타입</text>
    <rect x="240" y="1150" width="600" height="104" rx="52" fill="#7b61c9"/>
    <text x="540" y="1218" font-size="46" font-weight="800" fill="#fff">gwiinsaju.com</text>
    <text x="540" y="1110" font-size="38" font-weight="600" fill="#6b6680">너도 1초 만에 확인해 봐 ↓</text>
    </g></svg>`;
  }
  $('saveBtn').addEventListener('click',async()=>{
    if(!last)return;
    const img=new Image();const url=URL.createObjectURL(new Blob([cardSVG()],{type:'image/svg+xml'}));
    img.onload=async()=>{
      const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;cv.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);
      cv.toBlob(async blob=>{
        const file=new File([blob],'귀인사주_내기운.png',{type:'image/png'});
        try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'나는 '+last.E.name+' 많은 사람'});return;} }catch(e){if(e&&e.name==='AbortError')return;}
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='귀인사주_내기운.png';document.body.appendChild(a);a.click();a.remove();
      },'image/png');
    };
    img.src=url;
  });
  $('shareBtn').addEventListener('click',async()=>{
    const text=last?`나는 ${last.E.name} 많은 사람! 너는 무슨 기운이야?`:'나는 무슨 기운? 내 오행 1초 확인';
    const url='https://gwiinsaju.com/oheng.html';
    try{ if(navigator.share){await navigator.share({title:'귀인사주 · 내 오행 확인',text,url});return;} }catch(e){if(e&&e.name==='AbortError')return;}
    try{await navigator.clipboard.writeText(text+' '+url);alert('링크를 복사했어요!');}catch(e){prompt('이 링크를 복사해 주세요',url);}
  });
})();
</script>
</body>
</html>
