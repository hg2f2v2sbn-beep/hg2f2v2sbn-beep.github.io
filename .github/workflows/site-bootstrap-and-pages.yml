name: Guiin Saju - site-only bootstrap and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guiin-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build strictly allowlisted static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat > /tmp/guiin_site_allowlist.txt <<'SITE_ALLOWLIST'
          2026-fortune.html
          2027-fortune.html
          auth.html
          banner-breakup.webp
          banner-compat.webp
          banner-crush.webp
          banner-reunion.webp
          banner-shinsal.webp
          cheon-eul-gwiin.html
          company.html
          compatibility-interpreter.js
          compatibility.html
          deep-interpretation-v3.js
          demo.html
          expert-interpreter.js
          fox-clover.webp
          guiin-b3-fix.js
          guiin-b6-features.js
          guiin-deep-ai.js
          guiin-deep-compat-b3.js
          guiin-deep-compat.js
          guiin-deep-voice-b3.js
          guiin-deep-voice.js
          guiin-fortune-v2.js
          guiin-home-polish.js
          guiin-interpretation-v4-b3.js
          guiin-mobile-hardening-v6.27.css
          guiin-love-deep-v1.js
          guiin-pair-timing-v1.js
          guiin-past-daeun-v1.js
          guiin-production-guard-v6.27.js
          guiin-reading-core-v1.js
          guiin-reading-polish-v1.js
          guiin-runtime-config.js
          guiin-scene-art.js
          guiin-star-art.js
          guiin-ten-year-v1.js
          guiin-theme-v1.js
          guiin-theme.css
          hero-breakup.webp
          hero-compat.webp
          hero-crush.webp
          hero-reunion.webp
          hero-shinsal.webp
          home-today-penguin.webp
          index.html
          inquiry.html
          manse-view.js
          manse.html
          member-data-v1.js
          naver42a6e1da66e3379907c3b3e230a603d8.html
          naverb3e67070d710fa601ecf02256b3e1646.html
          payment-info.html
          privacy.html
          refund.html
          robots.txt
          saju-compatibility-guide.html
          saju-engine.js
          saju-words.html
          sitemap.xml
          terms.html
          today.html
          toss-payment.js
          SITE_ALLOWLIST
          # strip accidental leading spaces from indented heredoc lines
          sed -i 's/^[[:space:]]*//' /tmp/guiin_site_allowlist.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            test -f "$f" || { echo "::error::Required public asset missing: $f"; exit 1; }
            cp -- "$f" _site/
          done < /tmp/guiin_site_allowlist.txt
          shopt -s nullglob
          for f in *.webp *.jpg *.jpeg *.png *.svg *.ico *.gif; do
            [ -f "$f" ] || continue
            mime=$(file --brief --mime-type "$f")
            [[ "$mime" == image/* || "$mime" == text/xml || "$mime" == application/xml ]] || {
              echo "::error::Suspicious non-image content in: $f ($mime)"; exit 1;
            }
            cp -- "$f" _site/
          done
          touch _site/.nojekyll
          while IFS= read -r -d '' f; do
            b=${f#./}
            case "$b" in
              README.md|.gitignore|.nojekyll|CNAME) continue ;;
              *.jpg|*.jpeg|*.png|*.webp|*.svg|*.ico|*.gif) continue ;;
            esac
            if grep -Fxq -- "$b" /tmp/guiin_site_allowlist.txt; then continue; fi
            echo "::error::Non-site file in PUBLIC repository: $b"
            exit 1
          done < <(find . -maxdepth 1 -type f -print0)
          while IFS= read -r -d '' f; do
            b=${f#_site/}
            case "$b" in
              .nojekyll) continue ;;
              *.jpg|*.jpeg|*.png|*.webp|*.svg|*.ico|*.gif) continue ;;
            esac
            if grep -Fxq -- "$b" /tmp/guiin_site_allowlist.txt; then continue; fi
            echo "::error::Forbidden item in Pages artifact: $b"
            exit 1
          done < <(find _site -maxdepth 1 -type f -print0)
          if grep -RIEq -- '(sk-proj-[A-Za-z0-9_-]{12,}|(live|test)_sk_[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9_]{24,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----)' _site; then
            echo '::error::Potential secret literal in published website; investigate locally.'
            exit 1
          fi
          echo "Validated $(find _site -maxdepth 1 -type f | wc -l) public site files."
      - name: Verify direct HTML, CSS and image references
        shell: bash
        run: |
          set -euo pipefail
          cd _site
          missing=0
          # Extract static local refs; drop absolute paths and JS template fragments
          mapfile -t refs < <(
            grep -ohE '(src|href)="[^":#?]+\.(js|css|webp|jpg|jpeg|png|svg|ico|html)' *.html \
              | sed -E 's/^(src|href)="//' \
              | sed 's#^\./##' \
              | grep -v '^/' \
              | grep -v "['+[:space:]]" \
              | sort -u || true
          )
          for ref in "${refs[@]+"${refs[@]}"}" ; do
            [ -z "$ref" ] && continue
            if [[ "$ref" == *'..'* ]] || [ ! -f "$ref" ]; then
              echo "::error::Missing or unsafe local reference: $ref"; missing=1
            fi
          done
          exit "$missing"
      - uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
