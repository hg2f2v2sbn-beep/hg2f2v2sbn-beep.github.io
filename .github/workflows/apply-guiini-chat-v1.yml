name: apply-guiini-chat-v1
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply guiini chat UI patch onto current index.html
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess, hashlib
          patch_b64 = open('.github/workflows/guiini.patch.b64').read().strip()
          Path('/tmp/guiini.patch').write_bytes(base64.b64decode(patch_b64))
          before = Path('index.html').read_bytes()
          print('before', hashlib.sha256(before).hexdigest(), len(before))
          r = subprocess.run(['patch','-p1','-i','/tmp/guiini.patch'], capture_output=True, text=True)
          print(r.stdout)
          print(r.stderr)
          if r.returncode != 0:
              raise SystemExit(r.returncode)
          after = Path('index.html').read_bytes()
          h = hashlib.sha256(after).hexdigest()
          print('after', h, len(after))
          assert h == '81855bc7da72a67a3d67899c6978d4c1e0aa5ad5d2c24773cffb501d2e811e59', h
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git status
          git commit -m "feat(ui): 귀인이 AI 상담 화면 — 배지·말풍선 순차표시·이름 변경"
          git push
