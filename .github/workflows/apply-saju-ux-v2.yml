name: apply-saju-ux-v2
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch last good index and apply UX v2 patches
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/hg2f2v2sbn-beep/hg2f2v2sbn-beep.github.io/da8dbd6f847338c6cb82757c9d0a82a7e7f044a3/index.html" -o index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          old1 = '''    <div class=\"row3\" style=\"margin-top:7px\"><input id=\"year\" type=\"number\" min=\"1900\" max=\"2100\" inputmode=\"numeric\" placeholder=\"1991\"><input id=\"month\" type=\"number\" min=\"1\" max=\"12\" inputmode=\"numeric\" placeholder=\"11\"><input id=\"day\" type=\"number\" min=\"1\" max=\"31\" inputmode=\"numeric\" placeholder=\"23\"></div>\n    <label>출생 시간</label><div class=\"row2\"><input id=\"hour\" type=\"number\" min=\"0\" max=\"23\" inputmode=\"numeric\" placeholder=\"07\"><input id=\"minute\" type=\"number\" min=\"0\" max=\"59\" inputmode=\"numeric\" placeholder=\"40\"></div>'''
          new1 = '''    <div class=\"row3\" style=\"margin-top:7px\"><input id=\"year\" type=\"number\" min=\"1900\" max=\"2100\" inputmode=\"numeric\" placeholder=\"년\"><input id=\"month\" type=\"number\" min=\"1\" max=\"12\" inputmode=\"numeric\" placeholder=\"월\"><input id=\"day\" type=\"number\" min=\"1\" max=\"31\" inputmode=\"numeric\" placeholder=\"일\"></div>\n    <label>출생 시간</label><div class=\"row2\"><input id=\"hour\" type=\"number\" min=\"0\" max=\"23\" inputmode=\"numeric\" placeholder=\"시\"><input id=\"minute\" type=\"number\" min=\"0\" max=\"59\" inputmode=\"numeric\" placeholder=\"분\"></div>'''
          assert old1 in t, 'placeholder block missing'
          t = t.replace(old1, new1, 1)
          old2 = """  if($('name'))$('name').value=v.name||''; if($('year'))$('year').value=v.year||''; if($('month'))$('month').value=v.month||''; if($('day'))$('day').value=v.day||''; if($('hour'))$('hour').value=v.hour??''; if($('minute'))$('minute').value=v.minute??'';"""
          new2 = old2 + "\n  if($('hourUnknown')){$('hourUnknown').checked=!!v.hourUnknown;if(v.hourUnknown){if($('hour'))$('hour').value='';if($('minute'))$('minute').value='';}try{syncHourUnknownUI()}catch(_e){}}"
          assert old2 in t, 'restore block missing'
          t = t.replace(old2, new2, 1)
          old3 = """  const msg=validateBirthInput(inp,{label:'생년월일',calendar:inp.calendar});\n  if(msg){setFormMessage('sajuFormMsg',msg);showGuiinPopup(msg,'입력 정보를 다시 확인해 주세요');try{guiinMarkBirthError('',msg)}catch(_e){}return;}"""
          new3 = """  let msg=validateBirthInput(inp,{label:'생년월일',calendar:inp.calendar});\n  // UX: 시간 칸이 비었는데 '모릅니다'도 체크하지 않았으면 조용히 시간 미상으로 넘기지 않고 먼저 확인한다.\n  if(!msg&&!$('hourUnknown')?.checked){\n   const hBlank=String($('hour')?.value||'').trim()==='',miBlank=String($('minute')?.value||'').trim()==='';\n   if(hBlank)msg='출생시간이 비어 있어요. 시간을 입력하거나 ‘출생시간을 모릅니다’를 체크해 주세요.';\n   else if(miBlank)msg='출생시간의 분이 비어 있어요. 분을 입력해 주세요. 정각이면 0을 입력하면 돼요.';\n  }\n  if(msg){setFormMessage('sajuFormMsg',msg);showGuiinPopup(msg,'입력 정보를 다시 확인해 주세요');try{guiinMarkBirthError('',msg)}catch(_e){}return;}"""
          assert old3 in t, 'validation block missing'
          t = t.replace(old3, new3, 1)
          old4 = """    if(/시\\(時\\)/.test(msg))return H;\n    if(/분\\(分\\)/.test(msg))return MI;"""
          new4 = """    if(/시\\(時\\)|출생시간이 비어/.test(msg))return H;\n    if(/분\\(分\\)|분이 비어/.test(msg))return MI;"""
          assert old4 in t, 'mark error regex missing'
          t = t.replace(old4, new4, 1)
          p.write_text(t, encoding='utf-8')
          print('patched ok', p.stat().st_size)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git status
          git commit -m "fix(ux): 사주 입력 UX v2 — placeholder·시간 누락 안내·프로필 복원" || echo "no changes"
          git push
